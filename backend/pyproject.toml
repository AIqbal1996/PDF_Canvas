[project]
name = "pdf-canvas-backend"
version = "0.1.0"
description = "100% Local Enterprise PDF Canvas Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0.0",
    "uvicorn[standard]>=0.32,<1.0.0",
    "pydantic-settings>=2.6,<3.0.0",
    "python-multipart>=0.0.18,<1.0.0",
    "pypdf>=5.0.0,<8.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0.0",
    "pytest>=8.0,<9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
